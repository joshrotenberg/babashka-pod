[package]
name = "babashka-pod"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
description = "Write babashka pods in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/babashka-pod"
documentation = "https://docs.rs/babashka-pod"
readme = "README.md"
keywords = ["babashka", "clojure", "pod", "bencode"]
categories = ["development-tools"]
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["pods/fswatcher", "pods/sqlite"]
