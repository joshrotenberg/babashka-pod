[package]
name = "babashka-pod"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Write babashka pods in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/babashka-pod"
keywords = ["babashka", "clojure", "pod", "bencode"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["pods/fswatcher", "pods/sqlite"]
