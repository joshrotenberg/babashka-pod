[package]
name = "pod-treesitter"
version = "0.1.0"
edition = "2024"
# tree-sitter 0.27 needs 1.90.
rust-version = "1.90"
description = "A babashka pod for parsing source code, built on babashka-pod and tree-sitter"
license = "MIT OR Apache-2.0"
publish = false

# The pod-registry manifest written by `bb manifest` (see release/).
[package.metadata.pod-registry]
name = "joshrotenberg/pod-treesitter"
description = "Parse source code with tree-sitter: syntax trees, queries, and outlines of definitions"

[features]
default = ["clojure", "go", "javascript", "python", "rust", "typescript"]
clojure = ["dep:tree-sitter-clojure-orchard"]
go = ["dep:tree-sitter-go"]
javascript = ["dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
rust = ["dep:tree-sitter-rust"]
# TypeScript and TSX.
typescript = ["dep:tree-sitter-typescript"]

[dependencies]
babashka-pod = { path = "../.." }
tree-sitter = "0.27.1"
tree-sitter-language = "0.1.9"
tree-sitter-clojure-orchard = { version = "0.2.8", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
