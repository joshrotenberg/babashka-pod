[package]
name = "pod-fswatcher"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A babashka pod for watching files, built on babashka-pod and notify"
license = "MIT OR Apache-2.0"
publish = false

# The pod-registry manifest written by `bb manifest` (see release/).
[package.metadata.pod-registry]
name = "joshrotenberg/fswatcher"
description = "Watch files, built on notify; a drop-in for org.babashka/fswatcher"
example = "examples/joshrotenberg_fswatcher.clj"

[dependencies]
babashka-pod = { path = "../.." }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
