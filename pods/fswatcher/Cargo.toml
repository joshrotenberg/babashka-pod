[package]
name = "pod-fswatcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A babashka pod for watching files, built on babashka-pod and notify"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
babashka-pod = { path = "../.." }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
