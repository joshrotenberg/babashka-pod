name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # tests/babashka.rs fails instead of skipping when bb is missing.
  REQUIRE_BB: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A plain build catches features enabled only through dev-dependencies.
      - name: build
        run: cargo build --workspace

      - name: test
        run: cargo test --workspace

      # Release tooling (bb.edn, release/): header parsing and manifest checks.
      - name: release tooling tests
        run: bb release-test
