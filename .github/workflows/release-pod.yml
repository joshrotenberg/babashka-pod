name: release pod

# Releases one pod from pods/. Push a tag pod-<name>-v<version> whose version
# matches pods/<name>/Cargo.toml (pod-sqlite-v0.1.0 releases pods/sqlite), or
# run manually with an existing tag. Builds every platform, checks each
# binary's header against the platform it is released for (bb package /
# bb manifest), and creates a GitHub release with the zips, their sha256
# files, and a pod-registry manifest.edn. Other pods and the library are not
# touched.

on:
  push:
    tags: ["pod-*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. pod-sqlite-v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# An explicit bash shell runs with -o pipefail, so `bb release-plan | tee`
# fails the plan job when release-plan fails.
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pod: ${{ steps.plan.outputs.pod }}
      crate: ${{ steps.plan.outputs.crate }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest

      # Fails unless the tag is pod-<name>-v<version> for an existing pod
      # whose Cargo.toml has that version.
      - name: plan
        id: plan
        run: bb release-plan "$TAG" | tee -a "$GITHUB_OUTPUT"

  build:
    name: build ${{ needs.plan.outputs.crate }} ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            run-tests: true
          # Built on the arm64 runner; it cannot run x86_64 code without
          # Rosetta, so test.bb is skipped and the header check stands in.
          - target: x86_64-apple-darwin
            os: macos-14
            run-tests: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            run-tests: true
          # Cross-compiled with cross. A native arm64 runner (ubuntu-22.04-arm)
          # could run test.bb, but those runners may not be available to
          # private repositories.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            run-tests: false
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            run-tests: true
    defaults:
      run:
        shell: bash
    env:
      POD: ${{ needs.plan.outputs.pod }}
      CRATE: ${{ needs.plan.outputs.crate }}
      EXE: target/${{ matrix.target }}/release/${{ needs.plan.outputs.crate }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest

      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p "$CRATE" --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p "$CRATE" --target "${{ matrix.target }}"
          fi

      - name: header
        run: bb arch "$EXE"

      # pods/<name>/test.bb reads the binary from <NAME>_POD, e.g. SQLITE_POD.
      - name: test.bb
        if: matrix.run-tests
        run: |
          export "$(echo "$POD" | tr '[:lower:]-' '[:upper:]_')_POD=$EXE"
          bb "pods/$POD/test.bb"
          bb "pods/$POD/test.bb" socket

      - name: package
        run: bb package --pod "$POD" --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.crate }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      POD: ${{ needs.plan.outputs.pod }}
      CRATE: ${{ needs.plan.outputs.crate }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ needs.plan.outputs.crate }}-*
          merge-multiple: true

      # Opens every zip and checks the binary's header against its entry.
      - name: manifest
        run: bb manifest --pod "$POD" --base-url "https://github.com/${{ github.repository }}/releases/download/${TAG}"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip dist/*.sha256 dist/manifest.edn \
            --title "$TAG" \
            --notes "$CRATE $VERSION. manifest.edn is the pod-registry manifest for these assets."
